name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API (Node / TypeScript) ─────────────────────────────────────────────────
  api:
    name: API — type-check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse_ci
          POSTGRES_PASSWORD: pulse_ci
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pulse_ci:pulse_ci@localhost:5432/pulse_test
      NODE_ENV: test
      # Test-safe secrets — these will trigger the weak-secret warning but not fail
      JWT_SECRET: ci-test-jwt-secret-at-least-32-bytes-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-bytes-long
      COOKIE_SECRET: ci-test-cookie-secret-at-least-32-bytes
      STRIPE_SECRET_KEY: sk_test_placeholder_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_for_ci
      STRIPE_VENDOR_WEBHOOK_SECRET: whsec_vendor_placeholder_for_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to CI database
        run: npx prisma db push --force-reset

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

  # ── Web (Vite / React / TypeScript) ────────────────────────────────────────
  web:
    name: Web — type-check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

  # ── Docker build smoke test ─────────────────────────────────────────────────
  docker:
    name: Docker — build smoke test
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pulse-api:ci ./apps/api

      - name: Build Web image
        run: docker build -t pulse-web:ci ./apps/web
